# 공개 포트는 frontend와 backend뿐이고 나머지 서비스는 compose 네트워크 안에서 서비스 이름으로만 접근한다.
name: shortcut

x-secrets: &secrets
  INTERNAL_TOKEN: ${INTERNAL_TOKEN:?INTERNAL_TOKEN을 .env에 넣으세요}

# rabbitmq 이미지의 guest 계정은 컨테이너 밖에서 접속할 수 없어 서비스용 계정을 따로 만든다.
# 촬영판의 "오늘"과 시드의 첫 촬영일은 DB의 CURRENT_DATE로 정한다. 시간대가 UTC면 한국 오전 9시 전에 띄울 때
# 첫 촬영일(한강 공원 우천 시연)이 어제로 잡혀 촬영판이 다음 회차를 보여 주므로, DB와 JVM을 한국 시간으로 맞춘다.
x-tz: &tz
  TZ: Asia/Seoul
  JAVA_TOOL_OPTIONS: -Duser.timezone=Asia/Seoul

x-rabbit: &rabbit
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_USER: shortcut
  RABBITMQ_PASSWORD: shortcut

services:
  postgres:
    image: pgvector/pgvector:pg16
    command: ["postgres", "-c", "timezone=Asia/Seoul"]
    environment:
      TZ: Asia/Seoul
      POSTGRES_DB: shortcut
      POSTGRES_USER: shortcut
      POSTGRES_PASSWORD: shortcut
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shortcut -d shortcut"]
      interval: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: shortcut
      RABBITMQ_DEFAULT_PASS: shortcut
    ports:
      # 관리 화면은 retry 큐와 DLQ를 확인하는 용도로만 로컬에 연다.
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      retries: 20

  backend:
    build: ./backend
    environment:
      <<: [*secrets, *rabbit, *tz]
      SPRING_PROFILES_ACTIVE: api
      DB_URL: jdbc:postgresql://postgres:5432/shortcut
      DB_USER: shortcut
      DB_PASSWORD: shortcut
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET을 .env에 넣으세요}
      # 날씨 API(Open-Meteo) 실시간 예보. 무료 API는 키가 없고, 상용 주소를 쓸 때만 키를 .env에 넣는다.
      OPEN_METEO_URL: ${OPEN_METEO_URL:-https://api.open-meteo.com}
      OPEN_METEO_API_KEY: ${OPEN_METEO_API_KEY:-}
      WEATHER_FETCH_ENABLED: ${WEATHER_FETCH_ENABLED:-true}
    ports:
      - "${BACKEND_HOST_PORT:-18080}:8080"
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  worker:
    build: ./backend
    environment:
      <<: [*secrets, *rabbit, *tz]
      SPRING_PROFILES_ACTIVE: worker
      DB_URL: jdbc:postgresql://postgres:5432/shortcut
      DB_USER: shortcut
      DB_PASSWORD: shortcut
      JWT_SECRET: ${JWT_SECRET}
      WORKER_FAIL_FIRST_ATTEMPT: ${WORKER_FAIL_FIRST_ATTEMPT:-true}
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      backend: { condition: service_started }

  # MCP 서버 2개는 mcp/ 폴더(D 담당, 안윤태) 코드로 빌드한다.
  # 도구 이름, 인자, 오류 형식은 agent/app/harness/tools.py, backend /internal/** 와 맞춰 두었다.
  business-mcp:
    build: ./mcp/business-mcp
    environment:
      <<: *secrets
      BACKEND_INTERNAL_URL: http://backend:8080
    depends_on:
      - backend

  # 실행팀 Agent 전용 가상 외부 서비스 도구(장소, 장비, 허가, 차량, 연락, 장부). backend /internal/ops/** 를 부른다.
  ops-mcp:
    build: ./mcp/ops-mcp
    environment:
      <<: *secrets
      BACKEND_INTERNAL_URL: http://backend:8080
    depends_on:
      - backend

  rag-mcp:
    build: ./mcp/rag-mcp
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY를 .env에 넣으세요}
      EMBEDDING_PROVIDER: openai
      RAG_STORE: pgvector
      RAG_DB_DSN: postgresql://shortcut:shortcut@postgres:5432/shortcut
    depends_on:
      postgres: { condition: service_healthy }

  rag-indexer:
    # 질문과 별개로 규정 문서를 미리 색인하는 일회성 작업이다. rag-mcp가 뜰 때까지 실패하면 다시 시도한다.
    build: ./mcp/rag-mcp
    command: ["python", "-m", "rag_mcp.indexer"]
    environment:
      RAG_MCP_URL: http://rag-mcp:9102/mcp
    restart: on-failure:10
    depends_on:
      - rag-mcp

  agent:
    build: ./agent
    environment:
      <<: *secrets
      BACKEND_INTERNAL_URL: http://backend:8080
      BUSINESS_MCP_URL: http://business-mcp:9101/mcp
      RAG_MCP_URL: http://rag-mcp:9102/mcp
      OPS_MCP_URL: http://ops-mcp:9103/mcp
      RABBITMQ_URL: amqp://shortcut:shortcut@rabbitmq:5672/
      CHECKPOINT_DSN: postgresql://shortcut:shortcut@postgres:5432/shortcut?options=-csearch_path%3Dagent
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      FALLBACK_MODEL: ${FALLBACK_MODEL:-gpt-4.1-mini}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-true}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-shortcut}
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      business-mcp: { condition: service_started }
      rag-mcp: { condition: service_started }
      ops-mcp: { condition: service_started }

  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_HOST_PORT:-8088}:80"
    depends_on:
      - backend

volumes:
  pgdata:
