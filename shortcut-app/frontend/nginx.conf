server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API 응답(JSON)과 정적 파일을 압축한다. SSE(text/event-stream)는 목록에 넣지 않아 압축 버퍼에 묶이지 않고 바로 나간다.
    gzip on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/css image/svg+xml;

    # backend 컨테이너를 다시 띄우면 IP가 바뀌므로 시작 시 한 번 조회한 주소를 쓰지 않고 docker DNS로 10초마다 다시 찾는다.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://backend:8080;

    location /api/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE 이벤트가 nginx에 모였다가 한꺼번에 나가지 않도록 버퍼와 캐시를 끈다.
        proxy_buffering off;
        proxy_cache off;
        # 승인 대기처럼 오래 열린 SSE 연결이 기본 60초에 끊기지 않게 한다.
        proxy_read_timeout 3600s;
    }

    # 내부 API는 컨테이너끼리만 쓰므로 밖에서 들어온 요청은 SPA로도 넘기지 않고 막는다.
    location /internal/ {
        return 404;
    }

    # 빌드 파일은 이름에 내용 해시가 붙어 바뀌면 주소도 바뀌므로 오래 캐시해도 된다.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
