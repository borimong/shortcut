<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="촬영 당일 바뀐 일정을 다시 짜고, 필요한 팀장 승인을 받아 콜시트를 다시 보내는 재계획 도구입니다." />
    <!-- 글꼴은 쓰는 글자 범위만 받는 subset 판을 쓴다. 전체 판은 굵기마다 750KB가 넘는다.
         글꼴 CSS가 첫 화면을 막지 않도록 미리 받아 두었다가 다 받으면 적용한다. 그 전에는 시스템 서체로 보인다. -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="preload" as="style" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css" onload="this.onload=null;this.rel='stylesheet'" />
    <link rel="preload" as="style" href="https://cdn.jsdelivr.net/gh/wanteddev/wanted-sans@v1.0.3/packages/wanted-sans/fonts/webfonts/variable/split/WantedSansVariable.min.css" onload="this.onload=null;this.rel='stylesheet'" />
    <title>ShortCut</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
