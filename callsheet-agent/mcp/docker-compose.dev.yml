# D 개발용: 실제 backend 대신 mock-backend를 'backend'라는 이름으로 띄운다.
# 실제 backend가 준비되면 루트 docker-compose.yml에서 business-mcp, rag-mcp만 가져다 쓴다.
#   docker compose -f mcp/docker-compose.dev.yml up --build
services:
  backend:
    build: ./mock-backend
    environment:
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-dev-internal-token}
    ports: ["8080:8080"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 5s
      retries: 10

  business-mcp:
    build: ./business-mcp
    environment:
      BACKEND_URL: http://backend:8080
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-dev-internal-token}
    ports: ["9101:9101"]
    depends_on:
      backend: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 9101), 2)"]
      interval: 5s
      retries: 10

  rag-mcp:
    build: ./rag-mcp
    environment:
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-hash}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - ../data/docs:/data/docs:ro
      - rag-index:/index
    ports: ["9102:9102"]
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 9102), 2)"]
      interval: 5s
      retries: 10

volumes:
  rag-index:
