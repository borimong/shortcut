openapi: 3.1.0
info:
  title: 촬영 재계획 내부 API (rc2)
  version: 1.0.0-rc2
  description: |
    docker 내부 네트워크에서만 쓰는 API. 제공: B(Spring Boot). 제약·점수 엔진(evaluate, build, validate, save의 검증)은 C.
    호출: business-mcp(D)와 agent(E). agent `/tasks`, `/docs/...`는 backend만 호출한다(제공 E).
    모든 `/internal/**` 요청은 X-Internal-Token과 사용자 컨텍스트 헤더 4개를 붙인다 (이벤트 콜백은 토큰만).
    규칙과 계산식: contracts/ENGINE.md, 참조 구현: mcp/mock-backend/mock_backend/engine.py
servers:
  - url: http://backend:8080

tags:
  - { name: 온톨로지 }
  - { name: 계획안, description: 1/2/3안 재평가·요소 재조합·검증 }
  - { name: 변경, description: '변경 요청 역할(PRODUCTION_MANAGER, AD1, AD2)만. commit·booking은 필수 승인자 전원 승인 후' }
  - { name: 외부, description: 'backend가 외부 API를 부르거나 mock 데이터를 준다' }
  - { name: 작업 }
  - { name: agent }

paths:
  /internal/ontology/entities/{entityType}/{entityId}:
    get:
      tags: [온톨로지]
      operationId: getEntityContext
      summary: 엔티티와 직접 연결된 관계 (도구 get_entity_context)
      parameters:
        - $ref: '#/components/parameters/InternalToken'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/UserRole'
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/TaskId'
        - { name: entityType, in: path, required: true, schema: { $ref: './schemas/domain.schema.json#/$defs/EntityType' } }
        - { name: entityId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: 엔티티와 관계, content: { application/json: { schema: { $ref: './schemas/domain.schema.json#/$defs/EntityContext' } } } }
        '404': { $ref: '#/components/responses/Error' }

  /internal/ontology/impact:
    post:
      tags: [온톨로지]
      operationId: findImpactedEntities
      summary: 변경 이벤트의 영향 범위 묶음 조회 (도구 find_impacted_entities)
      parameters: [ { $ref: '#/components/parameters/InternalToken' }, { $ref: '#/components/parameters/UserId' }, { $ref: '#/components/parameters/UserRole' }, { $ref: '#/components/parameters/ProjectId' }, { $ref: '#/components/parameters/TaskId' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: './schemas/domain.schema.json#/$defs/ImpactRequest' } } } }
      responses:
        '200': { description: 영향 범위, content: { application/json: { schema: { $ref: './schemas/domain.schema.json#/$defs/ImpactResult' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /internal/ontology/links:
    post:
      tags: [온톨로지, 변경]
      operationId: linkEntity
      summary: 관계 추가 (도구 link_entity). 되돌릴 수 있음
      parameters: [ { $ref: '#/components/parameters/InternalToken' }, { $ref: '#/components/parameters/UserId' }, { $ref: '#/components/parameters/UserRole' }, { $ref: '#/components/parameters/ProjectId' }, { $ref: '#/components/parameters/TaskId' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: './schemas/domain.schema.json#/$defs/LinkRequest' } } } }
      responses:
        '201': { description: 추가됨, content: { application/json: { schema: { $ref: './schemas/domain.schema.json#/$defs/LinkResult' } } } }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /internal/plan-sets/{blockId}:
    get:
      tags: [계획안]
      operationId: getPlanSet
      summary: 블록의 1/2/3안 (도구 get_plan_set)
      parameters:
        - $ref: '#/components/parameters/InternalToken'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/UserRole'
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/TaskId'
        - { name: blockId, in: path, required: true, schema: { type: string } }
        - { name: date, in: query, required: true, schema: { $ref: './schemas/common.schema.json#/$defs/Date' } }
      responses:
        '200': { description: 1/2/3안, content: { application/json: { schema: { $ref: './schemas/plan.schema.json#/$defs/PlanSet' } } } }
        '404': { description: 'BLOCK_NOT_FOUND. details.available', content: { application/json: { schema: { $ref: './schemas/common.schema.json#/$defs/Error' } } } }

  /internal/availability:
    get:
      tags: [계획안]
      operationId: getAvailability
      summary: 배우·장소·장비 가능 시간 (도구 get_availability)
      parameters:
        - $ref: '#/components/parameters/InternalToken'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/UserRole'
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/TaskId'
        - { name: entityType, in: query, required: true, schema: { enum: [ACTOR, LOCATION, EQUIPMENT] } }
        - { name: entityId, in: query, required: true, schema: { type: string } }
        - { name: date, in: query, required: true, schema: { $ref: './schemas/common.schema.json#/$defs/Date' } }
      responses:
        '200': { description: 가능 시간, content: { application/json: { schema: { $ref: './schemas/domain.schema.json#/$defs/Availability' } } } }
        '404': { $ref: '#/components/responses/Error' }

  /internal/plans/evaluate:
    post:
      tags: [계획안]
      operationId: evaluatePlans
      summary: 1/2/3안 재평가 + 요소 조합 전수 검증·채점 (도구 evaluate_plans, 제공 C)
      description: 데이터를 바꾸지 않는다. ranked의 planHash는 바로 validate·save에 쓸 수 있게 backend가 잠시 보관한다.
      parameters: [ { $ref: '#/components/parameters/InternalToken' }, { $ref: '#/components/parameters/UserId' }, { $ref: '#/components/parameters/UserRole' }, { $ref: '#/components/parameters/ProjectId' }, { $ref: '#/components/parameters/TaskId' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: './schemas/domain.schema.json#/$defs/EvaluateRequest' } } } }
      responses:
        '200': { description: 순위, content: { application/json: { schema: { $ref: './schemas/plan.schema.json#/$defs/EvaluationResult' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /internal/plans/build:
    post:
      tags: [계획안]
      operationId: buildSchedule
      summary: 요소 조합으로 하루 계획 후보 만들기 (도구 build_schedule, 스케줄러). 판정 없음
      parameters: [ { $ref: '#/components/parameters/InternalToken' }, { $ref: '#/components/parameters/UserId' }, { $ref: '#/components/parameters/UserRole' }, { $ref: '#/components/parameters/ProjectId' }, { $ref: '#/components/parameters/TaskId' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: './schemas/domain.schema.json#/$defs/BuildRequest' } } } }
      responses:
        '200': { description: 후보, content: { application/json: { schema: { $ref: './schemas/plan.schema.json#/$defs/PlanCandidate' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /internal/plans/validate:
    post:
      tags: [계획안]
      operationId: validatePlan
      summary: HARD 5분류 검증 + SOFT 6개 채점 (도구 validate_plan, 제공 C)
      description: 위반이 있어도 200이다 (valid=false). 후보를 만든 뒤 원본이 바뀌었으면 409 STALE_PLAN.
      parameters: [ { $ref: '#/components/parameters/InternalToken' }, { $ref: '#/components/parameters/UserId' }, { $ref: '#/components/parameters/UserRole' }, { $ref: '#/components/parameters/ProjectId' }, { $ref: '#/components/parameters/TaskId' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: './schemas/domain.schema.json#/$defs/ValidateRequest' } } } }
      responses:
        '200': { description: 검증 결과, content: { application/json: { schema: { $ref: './schemas/plan.schema.json#/$defs/ValidationResult' } } } }
        '404': { description: CANDIDATE_NOT_FOUND, content: { application/json: { schema: { $ref: './schemas/common.schema.json#/$defs/Error' } } } }
        '409': { description: STALE_PLAN, content: { application/json: { schema: { $ref: './schemas/common.schema.json#/$defs/Error' } } } }

  /internal/plans:
    post:
      tags: [계획안, 변경]
      operationId: savePlan
      summary: 최적안 1개를 변경안(vN)으로 저장하고 필수 승인자 지정 (도구 save_plan)
      description: 저장 전에 다시 검증한다(검증 게이트). 위반이 있으면 422. 필수 승인자 규칙은 ENGINE.md 4장.
      parameters: [ { $ref: '#/components/parameters/InternalToken' }, { $ref: '#/components/parameters/UserId' }, { $ref: '#/components/parameters/UserRole' }, { $ref: '#/components/parameters/ProjectId' }, { $ref: '#/components/parameters/TaskId' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: './schemas/domain.schema.json#/$defs/SavePlanRequest' } } } }
      responses:
        '201': { description: 저장됨, content: { application/json: { schema: { $ref: './schemas/plan.schema.json#/$defs/SavedPlan' } } } }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { description: 'HARD_VIOLATION. details.violations', content: { application/json: { schema: { $ref: './schemas/common.schema.json#/$defs/Error' } } } }

  /internal/plans/{planId}/commit:
    post:
      tags: [변경]
      operationId: commitPlan
      summary: 승인된 변경안 확정 (도구 commit_plan). 콜시트 배포·알림을 Outbox에 넣는다
      parameters:
        - $ref: '#/components/parameters/InternalToken'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/UserRole'
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - { name: planId, in: path, required: true, schema: { type: integer } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: './schemas/domain.schema.json#/$defs/CommitRequest' } } } }
      responses:
        '200': { description: 확정됨. 같은 Idempotency-Key면 같은 응답, content: { application/json: { schema: { $ref: './schemas/plan.schema.json#/$defs/CommitResult' } } } }
        '404': { $ref: '#/components/responses/Error' }
        '409': { description: 'APPROVAL_REQUIRED (details.pendingRoles) 또는 STALE_PLAN', content: { application/json: { schema: { $ref: './schemas/common.schema.json#/$defs/Error' } } } }
        '422': { $ref: '#/components/responses/Error' }

  /internal/bookings:
    post:
      tags: [변경]
      operationId: requestLocationBooking
      summary: 장소 예약 요청 (도구 request_location_booking). API 협의 전에는 MANUAL_PENDING
      parameters:
        - $ref: '#/components/parameters/InternalToken'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/UserRole'
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: { required: true, content: { application/json: { schema: { $ref: './schemas/domain.schema.json#/$defs/BookingRequest' } } } }
      responses:
        '202': { description: 예약 요청됨, content: { application/json: { schema: { $ref: './schemas/plan.schema.json#/$defs/Booking' } } } }
        '404': { $ref: '#/components/responses/Error' }
        '409': { description: APPROVAL_REQUIRED 또는 BOOKING_NOT_NEEDED, content: { application/json: { schema: { $ref: './schemas/common.schema.json#/$defs/Error' } } } }

  /internal/external/weather:
    get:
      tags: [외부]
      operationId: getWeather
      summary: 시간대별 강수 확률 (도구 get_weather, 기상청 예보)
      parameters:
        - $ref: '#/components/parameters/InternalToken'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/UserRole'
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/TaskId'
        - { name: locationId, in: query, required: true, schema: { type: string } }
        - { name: date, in: query, required: true, schema: { $ref: './schemas/common.schema.json#/$defs/Date' } }
      responses:
        '200': { description: 예보, content: { application/json: { schema: { $ref: './schemas/domain.schema.json#/$defs/Weather' } } } }
        '404': { $ref: '#/components/responses/Error' }

  /internal/external/locations:
    get:
      tags: [외부]
      operationId: searchLocations
      summary: 대체 장소 검색 (도구 search_locations, 아워플레이스)
      parameters:
        - $ref: '#/components/parameters/InternalToken'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/UserRole'
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/TaskId'
        - { name: keyword, in: query, required: false, schema: { type: string } }
        - { name: area, in: query, required: false, schema: { type: string } }
        - { name: indoor, in: query, required: false, schema: { type: boolean } }
        - { name: minArea, in: query, required: false, schema: { type: integer } }
      responses:
        '200': { description: 후보, content: { application/json: { schema: { $ref: './schemas/domain.schema.json#/$defs/LocationSearchResult' } } } }

  /internal/external/route:
    get:
      tags: [외부]
      operationId: getRoute
      summary: 이동 거리·시간 (도구 get_route, 지도 경로 API)
      parameters:
        - $ref: '#/components/parameters/InternalToken'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/UserRole'
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/TaskId'
        - { name: from, in: query, required: true, schema: { type: string } }
        - { name: to, in: query, required: true, schema: { type: string } }
      responses:
        '200': { description: 경로, content: { application/json: { schema: { $ref: './schemas/domain.schema.json#/$defs/Route' } } } }
        '404': { $ref: '#/components/responses/Error' }

  /internal/external/equipment-quote:
    get:
      tags: [외부]
      operationId: getEquipmentQuote
      summary: 장비 묶음 견적 (도구 get_equipment_quote, 장비 렌탈사)
      parameters:
        - $ref: '#/components/parameters/InternalToken'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/UserRole'
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/TaskId'
        - { name: packageId, in: query, required: true, schema: { type: string } }
        - { name: date, in: query, required: true, schema: { $ref: './schemas/common.schema.json#/$defs/Date' } }
      responses:
        '200': { description: 견적, content: { application/json: { schema: { $ref: './schemas/domain.schema.json#/$defs/EquipmentQuote' } } } }
        '404': { $ref: '#/components/responses/Error' }

  /internal/tasks/{taskId}/events:
    post:
      tags: [작업]
      operationId: postTaskEvent
      summary: agent 진행 이벤트 콜백 (제공 B, 호출 E)
      description: backend는 seq를 매겨 저장한다. 화면은 /api/ai/tasks/{id}/events 폴링으로 읽는다.
      parameters:
        - $ref: '#/components/parameters/InternalToken'
        - { name: taskId, in: path, required: true, schema: { $ref: './schemas/common.schema.json#/$defs/TaskId' } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: './schemas/task.schema.json#/$defs/TaskEvent' } } } }
      responses:
        '202': { description: 저장됨, content: { application/json: { schema: { $ref: './schemas/domain.schema.json#/$defs/EventAccepted' } } } }
        '404': { $ref: '#/components/responses/Error' }

  /tasks:
    servers: [ { url: 'http://agent:8000', description: agent (E) } ]
    post:
      tags: [agent]
      operationId: agentStartTask
      summary: 큐 도입 전 임시 경로. 본문은 ai.tasks 큐 메시지와 같다
      requestBody: { required: true, content: { application/json: { schema: { $ref: './schemas/task.schema.json#/$defs/QueueMessage' } } } }
      responses:
        '202': { description: 접수 }

  /docs/{docId}/sections/{section}:
    servers: [ { url: 'http://agent:8000', description: agent (E) } ]
    get:
      tags: [agent]
      operationId: agentReadDocSection
      summary: rag-mcp Resource doc://{docId}/{section}을 대신 읽는다 (backend /api/docs가 호출)
      parameters:
        - { name: docId, in: path, required: true, schema: { type: string } }
        - { name: section, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: 원문, content: { application/json: { schema: { $ref: './schemas/api.schema.json#/$defs/DocSection' } } } }
        '404': { $ref: '#/components/responses/Error' }

components:
  parameters:
    InternalToken: { name: X-Internal-Token, in: header, required: true, schema: { type: string } }
    UserId: { name: X-User-Id, in: header, required: true, schema: { type: integer } }
    UserRole: { name: X-User-Role, in: header, required: true, schema: { $ref: './schemas/common.schema.json#/$defs/Role' } }
    ProjectId: { name: X-Project-Id, in: header, required: true, schema: { $ref: './schemas/common.schema.json#/$defs/ProjectId' } }
    TaskId: { name: X-Task-Id, in: header, required: true, schema: { $ref: './schemas/common.schema.json#/$defs/TaskId' } }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string }
      description: '{taskId}-{tool}-{planId}. 같은 키로 다시 오면 처음 응답을 그대로 돌려주고 다시 실행하지 않는다'
  responses:
    Error:
      description: '오류 {code, message, details}'
      content: { application/json: { schema: { $ref: './schemas/common.schema.json#/$defs/Error' } } }
