openapi: 3.1.0
info:
  title: 촬영 재계획 외부 API (rc2)
  version: 1.0.0-rc2
  description: |
    frontend(A)가 호출하는 유일한 API. 제공: B.
    - 실시간 표시는 Notion v2대로 "202 접수 + 폴링": 진행 상황 1~2초, 승인 현황 5초, 알림 30초.
    - 모든 요청은 Authorization: Bearer <JWT>. 권한 판단은 backend만 한다.
    - 오류 본문은 {code, message, details}.
servers:
  - url: http://localhost:8080
security:
  - bearer: []

paths:
  /api/auth/login:
    post:
      operationId: login
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: './schemas/api.schema.json#/$defs/LoginRequest' } } } }
      responses:
        '200': { description: 로그인, content: { application/json: { schema: { $ref: './schemas/api.schema.json#/$defs/LoginResponse' } } } }
        '401': { $ref: '#/components/responses/Error' }

  /api/me:
    get:
      operationId: getMe
      responses:
        '200': { description: 내 정보와 역할, content: { application/json: { schema: { $ref: './schemas/api.schema.json#/$defs/Me' } } } }

  /api/projects/{projectId}/today:
    get:
      operationId: getTodayBoard
      summary: 오늘의 촬영판 (현재 계획, 날씨, 변동 이력)
      parameters:
        - { name: projectId, in: path, required: true, schema: { $ref: './schemas/common.schema.json#/$defs/ProjectId' } }
        - { name: date, in: query, required: false, schema: { $ref: './schemas/common.schema.json#/$defs/Date' } }
      responses:
        '200': { description: 촬영판, content: { application/json: { schema: { $ref: './schemas/api.schema.json#/$defs/TodayBoard' } } } }

  /api/ai/tasks:
    post:
      operationId: createTask
      summary: 변경 이벤트 입력 → 재계획 작업 접수 (제작실장, 1·2조감독). 바로 202
      requestBody: { required: true, content: { application/json: { schema: { $ref: './schemas/api.schema.json#/$defs/CreateTaskRequest' } } } }
      responses:
        '202': { description: 접수됨. 같은 이벤트가 처리 중이면 기존 taskId와 deduplicated=true, content: { application/json: { schema: { $ref: './schemas/api.schema.json#/$defs/TaskCreated' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    get:
      operationId: listTasks
      parameters:
        - { name: mine, in: query, required: false, schema: { type: boolean, default: true } }
      responses:
        '200': { description: 작업 목록 (최신순), content: { application/json: { schema: { type: array, items: { $ref: './schemas/api.schema.json#/$defs/TaskSummary' } } } } }

  /api/ai/tasks/{taskId}:
    get:
      operationId: getTask
      parameters:
        - { name: taskId, in: path, required: true, schema: { $ref: './schemas/common.schema.json#/$defs/TaskId' } }
      responses:
        '200': { description: 작업 상태, content: { application/json: { schema: { $ref: './schemas/api.schema.json#/$defs/TaskDetail' } } } }
        '404': { $ref: '#/components/responses/Error' }

  /api/ai/tasks/{taskId}/events:
    get:
      operationId: pollTaskEvents
      summary: 진행 상황 폴링 (1~2초). after 다음 이벤트부터
      parameters:
        - { name: taskId, in: path, required: true, schema: { $ref: './schemas/common.schema.json#/$defs/TaskId' } }
        - { name: after, in: query, required: false, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200': { description: 이벤트 묶음, content: { application/json: { schema: { $ref: './schemas/api.schema.json#/$defs/TaskEventsPage' } } } }
        '404': { $ref: '#/components/responses/Error' }

  /api/ai/tasks/{taskId}/stream:
    get:
      operationId: streamTask
      summary: (선택) 같은 이벤트를 SSE로. 교안 API 계약 호환용. 화면은 폴링만 써도 된다
      parameters:
        - { name: taskId, in: path, required: true, schema: { $ref: './schemas/common.schema.json#/$defs/TaskId' } }
      responses:
        '200': { description: 'text/event-stream. 각 이벤트 data = StoredEvent', content: { text/event-stream: { schema: { type: string } } } }

  /api/plans/{planId}:
    get:
      operationId: getPlanDetail
      summary: 변경안 상세 (원본 대비 변경, 종합 점수, 규정 근거, 미확정 항목)
      parameters:
        - { name: planId, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: 변경안, content: { application/json: { schema: { $ref: './schemas/api.schema.json#/$defs/PlanDetail' } } } }
        '404': { $ref: '#/components/responses/Error' }

  /api/plans/{planId}/approvals:
    get:
      operationId: getApprovalBoard
      summary: 승인 현황 보드 (5초 폴링, 가입한 구성원 누구나)
      parameters:
        - { name: planId, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: 승인 현황, content: { application/json: { schema: { $ref: './schemas/api.schema.json#/$defs/ApprovalBoard' } } } }
        '404': { $ref: '#/components/responses/Error' }
    post:
      operationId: decideApproval
      summary: 승인자 본인의 승인·거절. 필수 승인자 목록에 있는 사람만
      description: 전원 승인이면 backend가 RESUME(ALL_APPROVED), 1명이라도 거절하면 즉시 RESUME(REJECTED, rejections)를 큐에 넣는다.
      parameters:
        - { name: planId, in: path, required: true, schema: { type: integer } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: './schemas/api.schema.json#/$defs/ApprovalDecisionRequest' } } } }
      responses:
        '202': { description: 기록됨 }
        '403': { $ref: '#/components/responses/Error' }
        '409': { description: 'ALREADY_DECIDED 또는 STALE_PLAN', content: { application/json: { schema: { $ref: './schemas/common.schema.json#/$defs/Error' } } } }

  /api/notifications:
    get:
      operationId: listNotifications
      summary: 헤더 종 알림 (30초 폴링)
      parameters:
        - { name: after, in: query, required: false, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200': { description: 알림, content: { application/json: { schema: { $ref: './schemas/api.schema.json#/$defs/NotificationList' } } } }

  /api/notifications/{notificationId}/read:
    post:
      operationId: markNotificationRead
      parameters:
        - { name: notificationId, in: path, required: true, schema: { type: integer } }
      responses:
        '204': { description: 읽음 처리 }
        '404': { $ref: '#/components/responses/Error' }

  /api/callsheets/me:
    get:
      operationId: getMyCallsheet
      parameters:
        - { name: date, in: query, required: true, schema: { $ref: './schemas/common.schema.json#/$defs/Date' } }
      responses:
        '200': { description: 확정 콜시트, content: { application/json: { schema: { $ref: './schemas/api.schema.json#/$defs/Callsheet' } } } }
        '404': { $ref: '#/components/responses/Error' }

  /api/docs/{docId}/sections/{section}:
    get:
      operationId: getDocSection
      summary: 규정 근거 원문 (backend → agent → rag-mcp Resource)
      parameters:
        - { name: docId, in: path, required: true, schema: { type: string } }
        - { name: section, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: 원문, content: { application/json: { schema: { $ref: './schemas/api.schema.json#/$defs/DocSection' } } } }
        '404': { $ref: '#/components/responses/Error' }

components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, bearerFormat: JWT }
  responses:
    Error:
      description: '오류 {code, message, details}'
      content: { application/json: { schema: { $ref: './schemas/common.schema.json#/$defs/Error' } } }
